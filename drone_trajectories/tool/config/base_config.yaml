# 基础配置模板
# 所有实验都继承自此模板

model:
  input_size: 16
  hidden_dim: 128
  num_layers: 3
  output_steps: 10
  use_attention: false
  bidirectional: false

features:
  enable_multiscale_velocity: true
  velocity_scales: [1, 2, 3]
  enable_curvature: true
  enable_plane_curvature: true

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 1e-5
  early_stopping_patience: 10

data:
  dt: 0.1
  input_length: 20
  validation_split: 0.1

experiment:
  name: "base"
  version: "v0"
  description: "Base configuration template"
  tags: [baseline]
